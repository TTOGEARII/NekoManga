name: Release

# v0.1.1 처럼 v로 시작하는 태그를 푸시하면 설치 파일을 빌드해 GitHub Release로 배포한다.
# 배포된 릴리스는 앱이 시작할 때 자동으로 감지해 업데이트 버튼을 띄운다 (Velopack).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get version from tag
        id: ver
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      - name: Publish (self-contained)
        run: dotnet publish src/NekoManga.App/NekoManga.App.csproj -c Release -r win-x64 --self-contained -o publish /p:Version=${{ steps.ver.outputs.version }}

      - name: Install Velopack CLI
        # csproj의 Velopack PackageReference와 같은 버전으로 고정 — 어긋나면 Setup.exe가 행업한다.
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous releases (for delta updates)
        run: vpk download github --repoUrl https://github.com/TTOGEARII/NekoManga --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Pack installer
        run: vpk pack -u NekoManga -v ${{ steps.ver.outputs.version }} -p publish -e NekoManga.exe --packTitle "NekoManga" --packAuthors "TTOGEARII" --shortcuts Desktop,StartMenuRoot --splashImage assets/splash-setup.gif --splashProgressColor "#FF77A8"

      - name: Upload to GitHub Release
        run: vpk upload github --repoUrl https://github.com/TTOGEARII/NekoManga --publish --releaseName "NekoManga v${{ steps.ver.outputs.version }}" --tag ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }}

      # models/ 아래 모델(censor_seg.onnx = 검열 검출)을 같은 릴리스에
      # 자산으로 첨부한다 — 앱의 구성요소 설치가 이 주소(.../releases/latest/download/<파일>)에서 받는다.
      # 만화판 LaMa(lama_manga.onnx, 211MB)는 git 100MiB 제한 때문에 여기 없고, 고정 태그 `models`의 **사전 릴리스** 자산이다
      # (.../releases/download/models/lama_manga.onnx — ComponentCatalog.ModelLama 주석의 gh 명령으로 한 번만 올린다).
      - name: Attach trained models
        if: hashFiles('models/*') != ''
        shell: pwsh
        run: |
          $files = Get-ChildItem models -File | ForEach-Object { $_.FullName }
          gh release upload ${{ github.ref_name }} $files --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
